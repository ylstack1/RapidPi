name: Build

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target'
        required: true
        default: 'android-debug'
        type: choice
        options:
          - android-debug
          - desktop-linux
          - desktop-windows
          - desktop-macos
          - engine-pack
          - android-with-engine

jobs:
  android-debug:
    if: github.event.inputs.target == 'android-debug'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358 cmake;3.22.1'
      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rapid-pi-android-debug
          path: android/app/build/outputs/apk/debug/*.apk

  desktop-linux:
    if: github.event.inputs.target == 'desktop-linux'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Build desktop
        working-directory: desktop
        run: cargo build --release
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: rapid-pi-desktop-linux
          path: desktop/target/release/rapid-pi-desktop 2>/dev/null || desktop/target/release/waku

  desktop-windows:
    if: github.event.inputs.target == 'desktop-windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build desktop
        working-directory: desktop
        run: cargo build --release
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: rapid-pi-desktop-windows
          path: desktop/target/release/*.exe

  desktop-macos:
    if: github.event.inputs.target == 'desktop-macos'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build desktop
        working-directory: desktop
        run: cargo build --release
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: rapid-pi-desktop-macos
          path: desktop/target/release/waku

  engine-pack:
    if: github.event.inputs.target == 'engine-pack' || github.event.inputs.target == 'android-with-engine'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build engine pack
        working-directory: android/engine
        run: ./build-pack.sh
      - name: Upload engine pack
        uses: actions/upload-artifact@v4
        with:
          name: rapid-pi-engine-pack
          path: android/engine/out/

  android-with-engine:
    if: github.event.inputs.target == 'android-with-engine'
    runs-on: ubuntu-latest
    needs: engine-pack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358 cmake;3.22.1'
      - name: Download engine pack
        uses: actions/download-artifact@v4
        with:
          name: rapid-pi-engine-pack
          path: android/engine/out
      - name: Build debug APK with engine
        working-directory: android
        run: ./gradlew :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rapid-pi-android-debug-engine
          path: android/app/build/outputs/apk/debug/*.apk

  release:
    runs-on: ubuntu-latest
    needs: [android-debug, android-with-engine]
    if: always() && (needs.android-debug.result == 'success' || needs.android-with-engine.result == 'success')
    steps:
      - uses: actions/checkout@v4
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.inputs.target == 'android-with-engine' && 'rapid-pi-android-debug-engine' || 'rapid-pi-android-debug' }}
          path: release/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: Rapid Pi Android ${{ github.run_number }}
          files: release/*.apk
          draft: true
          prerelease: true
