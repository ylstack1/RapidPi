name: publish

# Publishes a release the release workflow drafted: signs SHA256SUMS when the draft has no SHA256SUMS.sig yet, checks
# SHA256SUMS.sig against keys/release.pub and that SHA256SUMS lists exactly the files of a release, each as it is
# (scripts/check-release-files.sh, scripts/release-files.txt), publishes the GitHub release as the latest, puts install.sh,
# install.ps1 and the site on gh-pages (https://rapid-pi.opensec.in), publishes the npm packages, and points the Homebrew formula
# (opensec-git/homebrew-tap) at the release.
#
# Signing: the release key is the secret RAPIDPI_SIGNING_KEY of the "release" environment, which only runs this workflow from
# rapid-pi; it is used in one step below and nowhere else. What runs near it is rapid-pi's, not the tag's: the tag must be a commit
# on rapid-pi, and the checks, the public key, the installers and the site are taken from rapid-pi as this run was started from it.
# A draft signed by hand (scripts/sign-release.sh) is published as signed.
#
# npm: with trusted publishing (npm's OpenID Connect link to this workflow and its "npm" environment; no token stored here). Set it up once for each of
# rapid-pi, rapid-pi-linux-x64, rapid-pi-linux-x64-baseline, rapid-pi-linux-x64-jit, rapid-pi-linux-arm64, rapid-pi-linux-arm64-jit,
# rapid-pi-darwin-arm64, rapid-pi-darwin-arm64-jit, @kushalkhemka/rapid-pi-win32-x64 and @kushalkhemka/rapid-pi-win32-x64-jit (docs/RELEASING.md), then set the repository variable NPM_TRUSTED_PUBLISHING to true. Until then the
# npm job is skipped and the packages are published from the maintainer's machine.
#
# Run it from rapid-pi with the tag (the workflow and its checks are rapid-pi's, the files published are the tag's):
#   gh workflow run publish.yml -R ylstack1/RapidPi -f tag=bolt-vX.Y.Z
# A release is staged first with -f prerelease=true: a GitHub pre-release, which only the beta channel takes
# (`rapid-pi update --channel beta`), with its builds on npm but not the rapid-pi package, and the site left as it is. Run it again
# for the same tag without it to make the release the latest.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The signed draft to publish (bolt-vX.Y.Z)"
        required: true
      prerelease:
        description: "Stage it as a pre-release (the beta channel) instead of making it the latest"
        type: boolean
        default: false

permissions:
  contents: read

# (One group for each tag: GitHub keeps only one waiting run per group, and a shared one would drop a tag's run.)
concurrency:
  group: publish-${{ github.event.inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag }}
  PRERELEASE: ${{ github.event.inputs.prerelease == 'true' }}

jobs:
  verify:
    name: Signature and checksums
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # (A draft release is only visible to a token that may write.)
    environment: release
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: The run
        run: |
          [ "$GITHUB_REF" = refs/heads/rapid-pi ] || { echo "run this workflow from rapid-pi"; exit 1; }
          printf '%s' "$TAG" | grep -Eq '^bolt-v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "not a release tag: $TAG"; exit 1; }
      # rapid-pi as this run was started from it (github.sha), with its history and tags: the checks and the key are its own.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is on rapid-pi
        run: |
          git rev-parse -q --verify "refs/tags/$TAG^{commit}" >/dev/null || { echo "no tag $TAG"; exit 1; }
          git merge-base --is-ancestor "refs/tags/$TAG^{commit}" "$GITHUB_SHA" ||
            { echo "::error::$TAG is not a commit on rapid-pi ($GITHUB_SHA): only what reached rapid-pi is signed and published"; exit 1; }
      - id: version
        run: echo "version=${TAG#bolt-v}" >> "$GITHUB_OUTPUT"
      - name: Download the draft
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release
        env:
          GH_TOKEN: ${{ github.token }}
      - name: The files (before anything is signed; no key here)
        run: scripts/check-release-files.sh release "${TAG#bolt-v}"
      - name: Sign
        working-directory: release
        run: |
          if [ -f SHA256SUMS.sig ] && [ -f SHA256SUMS.sshsig ]; then echo "the draft is signed"; exit 0; fi
          [ -n "$SIGNING_KEY" ] || { echo "::error::$TAG lacks SHA256SUMS.sig or SHA256SUMS.sshsig and the release environment has no RAPIDPI_SIGNING_KEY"; exit 1; }
          key="$RUNNER_TEMP/release-key.pem"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printenv SIGNING_KEY > "$key")
          openssl pkey -in "$key" -pubout | cmp -s - ../keys/release.pub || { echo "::error::RAPIDPI_SIGNING_KEY is not the key of keys/release.pub"; exit 1; }
          # Both signatures are made again whenever one is missing: one left from an earlier SHA256SUMS would not verify.
          # (Ed25519 signatures are deterministic, so a .sig that was already right comes out the same.)
          openssl pkeyutl -sign -inkey "$key" -rawin -in SHA256SUMS -out SHA256SUMS.sig
          node ../scripts/lib/sshsig.mjs sign "$key" SHA256SUMS SHA256SUMS.sshsig
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber SHA256SUMS.sig SHA256SUMS.sshsig
        env:
          SIGNING_KEY: ${{ secrets.RAPIDPI_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
      - name: Check
        run: |
          openssl version
          openssl pkeyutl -verify -pubin -inkey keys/release.pub -rawin -in release/SHA256SUMS -sigfile release/SHA256SUMS.sig
          printf 'rapid-pi namespaces="rapid-pi-release" %s\n' "$(node scripts/lib/sshsig.mjs pubkey keys/release.pub)" > "$RUNNER_TEMP/allowed_signers"
          ssh-keygen -Y verify -f "$RUNNER_TEMP/allowed_signers" -I rapid-pi -n rapid-pi-release -s release/SHA256SUMS.sshsig < release/SHA256SUMS
          scripts/check-release-files.sh release "${TAG#bolt-v}"

  release:
    name: GitHub release and site
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      # rapid-pi as this run was started from it: its installers and site go on gh-pages (publish-installer.sh pushes there).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Publish the release
        run: |
          if [ "$PRERELEASE" = true ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: install.sh, install.ps1 and the site
        if: env.PRERELEASE != 'true'
        run: |
          git config user.name "OpenSec"
          git config user.email "323596076+opensec-intelligence@users.noreply.github.com"
          scripts/publish-installer.sh origin
      - name: The installers are served
        if: env.PRERELEASE != 'true'
        run: |
          for installer in install.sh install.ps1; do
            served=""
            for _ in $(seq 30); do
              curl -fsSL "https://rapid-pi.opensec.in/$installer?$(date +%s)" | cmp -s - "$installer" && { served=1; break; }
              sleep 10
            done
            [ -n "$served" ] || echo "::warning::rapid-pi.opensec.in does not serve this $installer yet"
          done

  npm:
    name: npm
    needs: [verify, release]
    if: vars.NPM_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: npm
      url: https://www.npmjs.com/package/rapid-pi
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      # The tag (checked above to be on rapid-pi): the npm package of its version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # npm 11.5 or later publishes with the workflow's OpenID Connect token (trusted publishing); no token is configured. An
      # exact version: this job may publish.
      - name: npm with trusted publishing
        run: npm install -g npm@11.21.0 && npm --version
      - name: Download the release
        run: |
          mkdir -p "dist/$VERSION"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "dist/$VERSION" --pattern '*.tar.xz' --pattern 'rapid-pi-win32-*.zip' --pattern SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
      - name: The builds (rapid-pi-PLATFORM-VARIANT)
        env:
          RAPIDPI_NPM_EXISTING_ONLY: "1"
        # (A pre-release's builds under the dist-tag beta: the installers download a build by its version, never by a tag.)
        run: scripts/publish-npm-builds.sh "dist/$VERSION" -- --provenance $([ "$PRERELEASE" = true ] && echo --tag beta)
      - name: The rapid-pi package
        # (Not for a pre-release: `npm install -g rapid-pi` takes the latest release.)
        if: env.PRERELEASE != 'true'
        working-directory: npm
        # (A run again for the same release, to put the site and installers up again, finds it published: npm refuses that.)
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$(npm view "rapid-pi@$version" version 2>/dev/null)" = "$version" ]; then
            echo "npm already has rapid-pi@$version"
          else
            npm publish --access public --provenance
          fi

  # The Homebrew formula (Formula/rapid-pi.rb in opensec-git/homebrew-tap) is pointed at the release once it and npm are out:
  # its version, URLs and checksums, from the release's signed SHA256SUMS. With the repository secret HOMEBREW_TAP_TOKEN (a
  # fine-grained token that may write the tap's contents, docs/RELEASING.md); without it, a notice, and the release stands.
  # Not for a pre-release: `brew install` takes the latest release.
  homebrew:
    name: Homebrew formula
    needs: [verify, release, npm]
    # (After npm, or with npm skipped while trusted publishing is not set up.)
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.npm.result != 'failure' && github.event.inputs.prerelease != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - id: token
        name: The tap's token
        run: |
          if [ -n "$TAP_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No HOMEBREW_TAP_TOKEN secret: the Homebrew formula was not updated (docs/RELEASING.md)"
          fi
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      # rapid-pi as this run was started from it: the script and the release key.
      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: opensec-git/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: The release's checksums
        if: steps.token.outputs.present == 'true'
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/release" --pattern SHA256SUMS --pattern SHA256SUMS.sig
          openssl pkeyutl -verify -pubin -inkey keys/release.pub -rawin -in "$RUNNER_TEMP/release/SHA256SUMS" -sigfile "$RUNNER_TEMP/release/SHA256SUMS.sig"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Update and push the formula
        if: steps.token.outputs.present == 'true'
        run: |
          node scripts/update-homebrew-formula.mjs homebrew-tap/Formula/rapid-pi.rb "$RUNNER_TEMP/release/SHA256SUMS" "$VERSION"
          cd homebrew-tap
          if git diff --quiet; then echo "the formula is already rapid-pi $VERSION"; exit 0; fi
          git config user.name "OpenSec"
          git config user.email "323596076+opensec-intelligence@users.noreply.github.com"
          git commit -am "rapid-pi $VERSION"
          git push origin HEAD
