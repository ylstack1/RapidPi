blank_issues_enabled: false
contact_links:
  - name: A security vulnerability
    url: https://github.com/opensec-git/Rapid Pi/security/advisories/new
    about: Report it privately, never in a public issue (SECURITY.md).
  - name: A problem in Pi itself (stock Pi on Node or Bun does it too)
    url: https://github.com/earendil-works/pi/issues
    about: Rapid Pi runs Pi as released; a bug stock Pi has too belongs upstream.
  - name: A question or an idea to discuss
    url: https://github.com/opensec-git/Rapid Pi/discussions
    about: Usage questions, setup help and early ideas.
