# What ships in Rapid Pi is scanned; tests, benchmarks, build and maintenance scripts and example extensions are not.
name: Rapid Pi
paths-ignore:
  - "**/test/**"
  - "**/tests/**"
  - "**/*.test.ts"
  - "**/*.test.mjs"
  # The Android e2e harness: its ui.mjs `re=` queries are regexes by design, written by the test scripts.
  - android/e2e/**
  - bench/**
  - scripts/**
  - packages/*/scripts/**
  - packages/coding-agent/examples/**
  - examples/**
