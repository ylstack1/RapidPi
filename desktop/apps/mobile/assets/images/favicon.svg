<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded app-icon background -->
  <rect width="512" height="512" rx="120" fill="#1F2937"/>

  <!-- Creative stylized "R" + "Pi" mark -->
  <g filter="url(#glow)">
    <!-- The "R": thick, modern, with a custom leg that doubles as Pi's first stroke -->
    <path d="
      M 112 348
      L 112 164
      Q 112 128 148 128
      L 312 128
      Q 348 128 348 164
      L 348 260
      Q 348 296 312 296
      L 212 296
      L 148 448
      L 112 348 Z
    " fill="url(#brand)" stroke="none"/>

    <!-- Pi letter "π" sitting inside/beside the R, same creative stroke -->
    <path d="
      M 240 300
      L 240 236
      Q 240 216 268 216
      L 400 216
      Q 428 216 428 244
      L 428 300
      Q 428 328 400 328
      L 300 328
      L 240 300 Z
      M 372 244
      L 372 300
    " fill="#1F2937"/>

    <!-- Subtle lightning accent through the R leg (Rapid Pi speed) -->
    <path d="M 196 296 L 228 240 L 208 240 L 240 304 Z" fill="#FBBF24"/>
  </g>

  <!-- "Rapid Pi" wordmark small at bottom for app-icon contexts -->
  <text x="256" y="462" font-family="system-ui, sans-serif" font-size="24" font-weight="800"
        fill="#9CA3AF" text-anchor="middle" letter-spacing="2">RAPID PI</text>
</svg>
