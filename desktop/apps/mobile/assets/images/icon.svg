<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded app-icon background -->
  <rect width="1024" height="1024" rx="240" fill="#111827"/>

  <!-- Creative R that becomes Pi: the bowl is the R, the leg kicks out as Pi's stem -->
  <g filter="url(#glow)">
    <!-- R vertical spine -->
    <path d="M 230 680 L 230 344 Q 230 280 282 280 L 642 280 Q 694 280 694 332 L 694 512 Q 694 568 642 568 L 330 568 L 264 752 L 230 680 Z" fill="url(#brand)"/>

    <!-- Pi's top bar and bowl opening (the R's leg curves into Pi) -->
    <path d="
      M 300 620
      L 300 512
      Q 300 472 336 472
      L 660 472
      Q 700 472 700 512
      L 700 568
      Q 700 628 660 628
      L 420 628
      L 300 620 Z
    " fill="#111827"/>

    <!-- Pi vertical stem descending from R leg -->
    <path d="M 616 568 L 616 820 Q 616 880 680 880 L 744 880 Q 800 880 800 828" fill="url(#brand)"/>

    <!-- Lightning accent through the joint (Rapid speed) -->
    <path d="M 390 568 L 446 480 L 422 480 L 478 592 Z" fill="#FBBF24"/>
  </g>

  <!-- RAPID PI wordmark -->
  <text x="512" y="908" font-family="system-ui, sans-serif" font-size="52" font-weight="900"
        fill="#9CA3AF" text-anchor="middle" letter-spacing="6">RAPID PI</text>
</svg>
